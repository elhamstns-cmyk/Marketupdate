<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Publish monthly report</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="/css/site.css"></head><body><div class="container"><main class="dash" style="max-width:720px;margin:30px auto">
<h1>Publish the monthly report</h1>
<div class="card"><div class="field"><label for="tok">Admin password</label><input type="password" id="tok" autocomplete="current-password"></div>
<div class="field"><label for="data">Report data for the month</label><textarea id="data" rows="10" placeholder='{"month":"October 2026","asof":"November 3, 2026","cities":{…},"areas":{…}}'></textarea></div>
<div class="field"><label for="test">Send a test "ready" email to (optional)</label><input type="email" id="test" placeholder="info@ellasoltani.ca"></div>
<div class="row"><button class="btn ghost" id="bt">Send test email only</button><button class="btn" id="bp">Publish and email all subscribers</button></div><p id="out" role="status"></p></div>
<div class="card"><h2 style="font-size:1.5rem">Campaign email list</h2><p class="muted">Everyone who started sign-up, whether they ticked the marketing box, and whether they are paying.</p><div class="row"><button class="btn ghost" id="dl">Download the list</button><span id="lout" role="status"></span></div></div>
</main></div><script>
const $=i=>document.getElementById(i);
async function go(body){ $('out').className='';$('out').textContent='Working…'; let report; try{report=JSON.parse($('data').value)}catch{ $('out').className='err';$('out').textContent='The report data is not valid.';return}
  const r=await fetch('/api/admin-publish',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+$('tok').value},body:JSON.stringify({report,...body})}),j=await r.json();
  $('out').className=r.ok?'ok':'err'; $('out').textContent=r.ok?(j.test?`Test email sent (${j.emailed}). Nothing was published.`:`Published ${report.month}. Emails sent: ${j.emailed}.`):j.error; }
$('bt').onclick=()=>{ if(!$('test').value){$('out').className='err';$('out').textContent='Enter an email address for the test.';return} go({testTo:$('test').value}); };
$('bp').onclick=()=>{ if(confirm('Publish this report and email every subscriber now?')) go({notify:true}); };
$('dl').onclick=async()=>{const r=await fetch('/api/leads',{headers:{authorization:'Bearer '+$('tok').value}});if(!r.ok){$('lout').className='err';$('lout').textContent='Enter your admin password above first.';return}
  const t=await r.text(),n=t.trim().split('\n').length-1,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='campaign-list.csv';a.click();$('lout').className='ok';$('lout').textContent=n+' people on the list.';};
</script></body></html>
