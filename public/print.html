<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Report</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/report.css">
<style>
@page{size:letter;margin:12mm}
body{margin:0;background:#fff}
.sheet{max-width:780px;margin:0 auto;padding:10px 20px 24px;display:flex;flex-direction:column;gap:12px;font-size:12.5px;line-height:1.4;background:#fff!important;--bg:#fff!important;--ink:#10201a!important}
.sheet h1{font-size:2.2rem}.sheet h2{font-size:1.2rem}
.sheet .av{width:70px;height:70px}.sheet .who .nm{font-size:1.3rem}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.col{border:1px solid #d9e0dc;border-top:3px solid var(--pa);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:3px;break-inside:avoid}
.col .big{font-size:1.8rem}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:2px 6px;border-bottom:1px solid #d9e0dc}th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#5a6b64}
.hl{background:#eef3f0;font-weight:700}
.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:3px solid var(--pa);padding-top:10px}
.sheet footer{border:0;padding:0;font-size:.68rem}
.bar2{max-width:780px;margin:14px auto;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#ecf7f2;padding:10px 16px;border-radius:12px;font:500 15px Inter,system-ui,sans-serif}
.bar2 button{font:inherit;font-weight:700;background:#0f6b4f;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
@media print{.noprint{display:none!important}.sheet{zoom:.82;padding:0}}
</style></head><body>
<div class="bar2 noprint"><span>Choose <strong>Save as PDF</strong> in the print window.</span><button onclick="print()">Save as PDF / Print</button></div>
<div id="root" class="sheet rpt">Loading…</div>
<script type="module">
import { TYPES, T1, money, get, market, chg, regionSummary, readout, whoBlock, sourceLine, esc, areasOf, themeVars, palette, lum, SAMPLES } from '/js/report.js';
const s = location.pathname.split('/')[2], q = new URLSearchParams(location.search);
const r = await fetch('/api/report?slug=' + encodeURIComponent(s)), j = await r.json(), root = document.getElementById('root');
if (!r.ok) root.textContent = j.error; else {
  const D = j.report; let A = j.agent; if (j.sample) A = SAMPLES[q.get('s')] || SAMPLES.sarah;
  // Printed on white paper: keep the agent's fonts and accent, but always dark text on white.
  const P = palette({ ...A.theme, bg: '#ffffff' }), pa = lum(A.theme?.ac || '') > 0.8 ? '#10201a' : (A.theme?.ac || '#0f6b4f');
  root.style.cssText = themeVars({ ...A.theme, bg: '#ffffff' }) + `;--pa:${pa}`;
  const area = areasOf(D).includes(q.get('area')) ? q.get('area') : 'Greater Vancouver';
  document.title = `${area} Market Report ${D.month}`;
  const col = (t) => { const o = get(D, area, t), mk = market(o.ratio);
    return `<div class="col"><span class="eyebrow">${T1[t]}</span><div class="big">${o.price ? money(o.price) : 'No benchmark'}</div><div>${o.price ? chg(o.yoy, 'vs. last year') : ''}</div>
      <div style="margin-top:6px"><strong>${mk || ''}</strong>${o.ratio != null ? ` <span class="muted small">${o.ratio.toFixed(1)}% sold</span>` : ''}</div>
      <div class="small">Sold: <strong>${o.sales.toLocaleString()}</strong>${o.salesLy != null ? ` <span class="muted">(${o.salesLy.toLocaleString()} last year)</span>` : ''}</div>
      <div class="small">For sale: <strong>${o.active.toLocaleString()}</strong>${o.activeLy != null ? ` <span class="muted">(${o.activeLy.toLocaleString()} last year)</span>` : ''}</div>
      ${o.dom != null ? `<div class="small">Average days to sell: <strong>${o.dom}</strong> <span class="muted">(${o.domLy} last year)</span></div>` : ''}</div>`; };
  const names = Object.keys(D.areas || {}).sort();
  const cell = (a, t) => { const v = D.areas[a][t]; return `<td>${v.price ? money(v.price) : 'n/a'}</td><td>${v.yoy == null ? '' : chg(v.yoy)}</td>`; };
  root.innerHTML = `<div class="mast">${whoBlock(A)}</div>
    <div><p class="eyebrow">${esc(D.month)}</p><h1>${esc(area)} Market Report</h1></div>
    <p>${area === 'Greater Vancouver' ? regionSummary(D) : readout(D, area, 'detached') || regionSummary(D)}</p>
    <div class="cols">${TYPES.map(col).join('')}</div>
    ${names.length ? `<h2>Benchmark prices by area</h2><table><thead><tr><th>Area</th><th>Detached</th><th>1 yr</th><th>Townhome</th><th>1 yr</th><th>Condo</th><th>1 yr</th></tr></thead>
      <tbody>${names.map((a) => `<tr${a === area ? ' class="hl"' : ''}><td>${a}</td>${TYPES.map((t) => cell(a, t)).join('')}</tr>`).join('')}</tbody></table>` : ''}
    <div class="foot"><div><strong style="font-family:var(--hf);font-size:1.25rem">${esc(A.name || '')}</strong><br><span class="muted">${esc(A.brokerage || '')}</span></div>
      <div style="text-align:right">${[A.phone, A.contact_email, A.website].filter(Boolean).map(esc).join('<br>')}</div></div>
    <footer>${esc(sourceLine(D))}</footer>`;
}
</script></body></html>
