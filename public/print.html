<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Report</title>
<link rel="stylesheet" href="/css/report.css">
<style>
@page{size:letter;margin:0}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#e9eeec}
.bar2{max-width:816px;margin:14px auto;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;padding:10px 16px;border-radius:12px;font:500 15px Inter,system-ui,sans-serif}
.bar2 button{font:inherit;font-weight:700;background:#0f6b4f;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.pg{width:816px;height:1056px;margin:0 auto 18px;padding:54px 58px 40px;display:flex;flex-direction:column;gap:22px;box-shadow:0 10px 40px rgba(0,0,0,.12);overflow:hidden;position:relative;break-after:page;font-size:14px;line-height:1.5}
.pg:last-of-type{break-after:auto}
.pg h1{font-size:30px!important;line-height:1.1}.pg h2{font-size:18px!important}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:18px;border-bottom:2px solid var(--ac)}
.hdr .who .av{width:74px;height:74px}.hdr .who .nm{font-size:22px}
.hdr .brandlogo{max-height:56px;max-width:200px}.hdr .lgtxt{font-size:13px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cd{background:var(--tn);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.cd .pz{font-family:var(--hf);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1}
.cd .mk{font-weight:700;margin-top:6px}
.g{position:relative;height:9px;border-radius:6px;background:linear-gradient(90deg,#9cc7b0 30%,#ead9a6 30% 50%,#e3a184 50%);margin:4px 0 2px}
.g i{position:absolute;top:-4px;width:4px;height:17px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--tn)}
.kv{display:flex;justify-content:space-between;font-size:12.5px;border-top:1px solid var(--ln);padding-top:5px}
.reads{display:grid;gap:10px}.reads p{padding-left:14px;border-left:3px solid var(--ac)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);text-align:right;padding:6px 6px;border-bottom:1px solid var(--ln)}
.tbl th:first-child,.tbl td:first-child{text-align:left}.tbl td{padding:4.5px 6px;border-bottom:1px solid var(--ln);text-align:right}
.tbl .bw{width:26%}.tbl .b{height:8px;border-radius:3px;background:var(--ac)}
.tbl tr.hl td{background:var(--tn);font-weight:700}
.cta{margin-top:auto;background:var(--ac);color:var(--bt);border-radius:18px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px}
.cta b{font-family:var(--hf);font-size:22px;line-height:1.15;display:block}.cta .ct{text-align:right;font-weight:700;white-space:nowrap}
.src{font-size:10px;color:var(--mut)}.pn{position:absolute;right:58px;bottom:18px;font-size:10px;color:var(--mut)}
.cover{padding:0;gap:0}.cover>*{flex:none}.cover .cv-body{flex:1 1 auto;min-height:0}
.cv-band{background:var(--ac);color:var(--bt);padding:48px 58px 128px;position:relative;overflow:hidden}
.cv-band *{color:inherit!important}
.cv-band:before,.cv-band:after{content:"";position:absolute;border-radius:50%;border:2px solid currentColor;opacity:.13}
.cv-band:before{width:460px;height:460px;right:-150px;top:-170px}.cv-band:after{width:300px;height:300px;right:-70px;top:-90px}
.cv-brand{display:flex;justify-content:space-between;align-items:center;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11.5px;position:relative}
.cv-brand .chip{background:#fff;border-radius:10px;padding:8px 12px;display:inline-flex}.cv-brand img{max-height:40px;max-width:180px;display:block}
.cv-band .cv-kick{margin-top:var(--kick,112px);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;position:relative}
.cv-band h1{font-size:var(--h1,46px)!important;line-height:1.05;letter-spacing:-.025em;margin-top:10px;position:relative}
.cv-band .lede2{font-size:14px;line-height:1.6;margin-top:16px;max-width:560px;position:relative}
.cv-cards{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px;margin:-74px 58px 0;position:relative}
.cv-cards>div{background:var(--bg);border-radius:16px;padding:18px 20px;box-shadow:0 14px 34px rgba(0,0,0,.13);display:flex;flex-direction:column;gap:4px}
.cv-cards .l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.cv-cards b{font-family:var(--hf);font-size:26px;letter-spacing:-.02em;line-height:1.25}
.cv-body{padding:0 58px 40px;display:flex;flex-direction:column;flex:1}
.cv-facts{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:22px;margin-top:44px}
.cv-facts>div{border-top:2px solid var(--ac);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.cv-facts .l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.cv-facts b{font-family:var(--hf);font-size:24px;letter-spacing:-.02em;line-height:1.25}
.cv-facts .g{margin-top:8px}
.cv-who{display:flex;gap:22px;align-items:center;margin-top:16px}.cv-who img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);flex:none}
.cv-who .n{font-family:var(--hf);font-weight:700;font-size:23px;line-height:1.1}.cv-who .r{color:var(--mut);font-size:13.5px;margin-top:4px}
.cv-who .c{margin-top:10px;font-weight:600;font-size:13.5px;display:flex;gap:6px 18px;flex-wrap:wrap}
.cv-band h1,.cv-band .lede2{max-width:var(--tw,560px)}
.cvA-who{position:absolute;right:58px;top:104px;width:200px;text-align:center;z-index:1}
.cvA-who img{width:184px;height:184px;border-radius:50%;object-fit:cover;border:5px solid rgba(255,255,255,.92);box-shadow:0 12px 30px rgba(0,0,0,.18)}
.cvA-who b{display:block;font-family:var(--hf);font-size:19px;margin-top:12px;line-height:1.2}.cvA-who span{display:block;font-size:12.5px;margin-top:3px}
.cvB-who{position:absolute;right:58px;top:84px;width:200px;z-index:1}
.cvB-who img{width:200px;height:236px;border-radius:18px;object-fit:cover;object-position:center 20%;display:block;box-shadow:0 14px 34px rgba(0,0,0,.2)}
.cvB-who b{display:block;font-family:var(--hf);font-size:18px;margin-top:12px;line-height:1.2}.cvB-who span{display:block;font-size:12.5px;margin-top:2px}
.cvC-top{display:flex;align-items:center;gap:22px;padding:34px 58px 30px}
.cvC-top img.ph{width:132px;height:132px;border-radius:50%;object-fit:cover;border:4px solid var(--ac);flex:none}
.cvC-top .n{font-family:var(--hf);font-weight:700;font-size:28px;line-height:1.1}.cvC-top .r{color:var(--mut);font-size:14px;margin-top:4px}
.cvC-top .c{margin-top:10px;font-weight:600;font-size:13.5px;display:flex;gap:6px 18px;flex-wrap:wrap}.cvC-top .lg{margin-left:auto;max-height:54px;max-width:170px}
.cv-contact{margin-top:46px;display:flex;justify-content:space-between;align-items:center;gap:20px;border:1px solid var(--ln);border-radius:16px;padding:18px 22px}
.cv-contact b{font-family:var(--hf);font-size:18px;display:block}.cv-contact .c{font-weight:600;font-size:13.5px;display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:flex-end}
.tblock{display:grid;gap:4px}.tblock .tch{display:flex;justify-content:space-between;align-items:center;gap:10px}.tblock .tch>b{font-size:14px}
.tf{display:flex;gap:6px}.tf span{background:var(--tn);border-radius:999px;padding:3px 10px;font-size:11px;color:var(--mut)}.tf b{color:var(--ink)}
.tcv svg{display:block;overflow:visible}
.toc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:auto;margin-bottom:18px}.toc div{border-top:2px solid var(--ac);padding-top:10px;font-size:13px}.toc b{display:block;font-size:14px}
.pg.rpt{container-type:inline-size;font-size:13.5px}
.pg .svl{gap:7px}.pg .svl li{line-height:1.45}.pg h2{font-size:17px!important}
.pg .hlrow{grid-template-columns:150px 1fr!important;gap:18px!important;padding:12px 0!important}.pg .ill{height:76px!important}.pg .ill svg{height:50px!important}.pg .hltag{font-size:13px;padding:4px 11px}
.pg .mts{grid-template-columns:repeat(auto-fit,minmax(105px,1fr))!important;gap:10px 14px!important}.pg .num{font-size:19px}.pg .sub{font-size:11.5px}.pg .lab{font-size:10px}
.pg .mean>div{padding:12px 16px}.pg .mean p{font-size:12.5px}.pg .tcard{padding:14px 16px}.pg .tcard .big2{font-size:24px}.pg .tcard .kv{font-size:12px;padding-top:5px}
.pg .hlband{padding:16px 22px;border-radius:12px 12px 0 0}.pg .hlttl b{font-size:22px}.pg .av{width:56px!important;height:56px!important}
.pg .csmast h1{font-size:34px}.pg .bdmast h1{font-size:44px}.pg .cstbl td{padding:9px 6px}
.pg .ctbl td{padding:9px 8px}.pg .leg{font-size:12px}
.sec{display:flex;flex-direction:column;gap:10px}
@media print{body{background:#fff}.noprint{display:none!important}.pg{margin:0;box-shadow:none}}
@media screen and (max-width:860px){.pg{zoom:.45}}
</style></head><body>
<div class="bar2 noprint"><span>Choose <strong>Save as PDF</strong> in the print window.</span><button onclick="print()">Save as PDF / Print</button></div>
<div id="root"><p style="text-align:center;font-family:system-ui;padding:40px">Loading…</p></div>
<script type="module">
import { priceSeries, salesSeries, trendFacts, lineChart, barChart, multiChart, areaColours } from '/js/charts.js';
import { monthKey, typesNote, T1, money, chg, whoBlock, sourceLine, esc, areasOf, areaList, themeVars, palette, askCopy, SAMPLES, loadFonts, showOf, typesOf, layoutOf, mastHTML, shortHTML, typesHTML, meaningHTML, compareHTML, phoneFmt } from '/js/report.js';
const s = location.pathname.split('/')[2], q = new URLSearchParams(location.search);
const r = await fetch('/api/report?slug=' + encodeURIComponent(s) + (q.get('v') ? '&v=' + encodeURIComponent(q.get('v')) : '')), j = await r.json(), root = document.getElementById('root');
if (!r.ok) root.textContent = j.error; else {
  const D = j.report; let A = j.agent; if (j.sample) A = SAMPLES[q.get('s')] || SAMPLES.sarah;
  if (q.get('preview')) try { const o = JSON.parse(q.get('preview')); A = { ...A, theme: o.theme || A.theme, show: o.show || A.show }; } catch {}
  A = { ...A, phone: phoneFmt(A.phone) }; loadFonts([A.theme?.font || 'modern']);
  const L = areaList(j.view?.area || q.get('area'), D), main = L[0], lay = layoutOf(A.theme), vars = themeVars(A.theme).replaceAll('"', "'"), C = areaColours(palette(A.theme).fill);
  const ask = askCopy(A), sh = showOf(A), TS = typesOf(sh), anyPrice = sh.prices || sh.changes, endKey = monthKey(D.month);
  document.title = `${L.join(', ')} Market Report ${D.month}`;
  const contact = [A.phone, A.contact_email, (A.website || '').replace(/^https?:\/\//, '')].filter(Boolean).map(esc);
  const cta = `<div class="cta"><div><b>${ask.h}</b><span>${A.role === 'broker' ? 'Ask me about your pre-approval, renewal or refinance.' : 'Ask me for recent sales and price ranges on your street or in your building.'}</span></div><div class="ct">${contact.join('<br>')}</div></div>`;
  const hdr = `<div class="hdr">${whoBlock({ ...A, logo: '', brokerage: A.logo ? A.brokerage : '', mark: '' }).replace(/^<div class="lgtxt">.*?<\/div>/, '')}${A.logo ? `<img class="brandlogo" src="${esc(A.logo)}" alt="">` : ''}</div>`;
  const pt = TS.length === 3 ? 'composite' : TS[0], ptName = pt === 'composite' ? 'All home types' : T1[pt];
  const trendOn = sh.trend && D.history && (anyPrice || sh.sold) && L.some((a) => priceSeries(D.history, a, pt, endKey).length > 2);
  const compareOn = sh.compare && anyPrice;
  const pages = [];
  // one page per area: the first one opens with the style's own masthead
  L.forEach((a, i) => pages.push(`<div class="pg rpt st-${lay}" style="${vars}">${mastHTML(lay, A, D).replace(/<span data-id="aname"><\/span>|<h1 data-id="aname"><\/h1>/g, (m) => m.replace('><', `>${esc(a)}<`))}
    ${sh.summary ? `<div class="sec"><h2>The short version${L.length > 1 ? ` · ${esc(a)}` : ''}</h2>${shortHTML(D, a, sh)}</div>` : ''}
    <div class="sec"><h2>${esc(a)} at a glance</h2>${typesHTML(lay, D, a, sh)}</div>
    ${sh.meaning ? `<div class="sec"><h2>What this means</h2>${meaningHTML(D, a, sh, A)}</div>` : ''}
    ${cta}PN</div>`));
  if (trendOn) { const multi = L.length > 1 && anyPrice;
    pages.push(`<div class="pg rpt st-${lay}" style="${vars}">${hdr}<div><p class="eyebrow">${esc(D.month)}</p><h2>The last 12 months</h2><p class="muted" style="margin-top:4px">${multi ? `${ptName} benchmark price, change over 12 months. Every area starts at 0%.` : `How the typical home price has moved in ${esc(main)}${sh.sold ? ', and how many homes sold each month' : ''}.`}</p></div>
      ${multi ? `<div class="leg">${L.map((a, i) => `<span><i style="background:${C[i]}"></i>${esc(a)}</span>`).join('')}</div><div class="tcv" data-multi></div>` : anyPrice ? TS.map((t) => `<div class="tblock"><div class="tch"><b>${T1[t]} benchmark price</b><span class="tf">${sh.changes ? trendFacts(priceSeries(D.history, main, t, endKey)).map(([b, x]) => `<span><b>${b}</b> ${x}</span>`).join('') : ''}</span></div><div class="tcv" data-line="${t}"></div></div>`).join('') : ''}
      ${sh.sold ? `<div class="tblock"><div class="tch"><b>Homes sold each month</b><span class="small muted" data-sales-sub></span></div><div class="tcv" data-sales></div></div>` : ''}
      <p class="src">Benchmark prices are MLS® HPI figures from Greater Vancouver REALTORS® monthly reports.${typesNote(sh) ? ' ' + typesNote(sh) + '.' : ''}</p>PN</div>`); }
  if (compareOn) {
    if (L.length > 1) pages.push(`<div class="pg rpt st-${lay}" style="${vars}">${hdr}<div><p class="eyebrow">${esc(D.month)}</p><h2>How your areas compare</h2><p class="muted" style="margin-top:4px">${ptName === 'All home types' ? 'All home types' : T1[TS[0]]}, side by side.</p></div>${compareHTML(D, L, TS.length === 3 ? 'all' : TS[0], sh, C)}${cta}PN</div>`);
    else { const names = Object.keys(D.areas || {}).sort((a, b) => D.areas[b][TS[0]].price - D.areas[a][TS[0]].price), mx = names.length ? D.areas[names[0]][TS[0]].price : 1;
      const cols = TS.flatMap((t) => [sh.prices && [`${T1[t]} price`, (v) => (v.price ? money(v.price) : 'n/a')], sh.changes && [sh.prices ? 'Change in 1 yr' : `${T1[t]} change in 1 yr`, (v) => (v.yoy == null || !v.price ? '' : chg(v.yoy))]].filter(Boolean).map((c) => [...c, t]));
      pages.push(`<div class="pg rpt st-${lay}" style="${vars}">${hdr}<div><p class="eyebrow">${esc(D.month)}</p><h2>How the areas compare</h2></div>
        <table class="tbl"><thead><tr><th>Area</th>${sh.prices ? '<th class="bw"></th>' : ''}${cols.map((c) => `<th>${c[0]}</th>`).join('')}</tr></thead>
        <tbody>${names.map((a) => `<tr${a === main ? ' class="hl"' : ''}><td>${a}</td>${sh.prices ? `<td><div class="b" style="width:${(D.areas[a][TS[0]].price / mx * 100).toFixed(0)}%"></div></td>` : ''}${cols.map((c) => `<td>${c[1](D.areas[a][c[2]])}</td>`).join('')}</tr>`).join('')}</tbody></table>${cta}PN</div>`); }
  }
  root.innerHTML = pages.map((p, i) => p.replace('PN', `<p class="src" style="margin-top:auto">${esc(sourceLine(D))}</p><span class="pn">${i + 1} / ${pages.length}</span>`)).join('');
  root.querySelectorAll('.pg .cta').forEach((c) => (c.style.marginTop = '0'));
  if (trendOn) {
    const m = root.querySelector('[data-multi]'); if (m) multiChart(m, L.map((a, i) => ({ name: a, color: C[i], rows: priceSeries(D.history, a, pt, endKey) })), { interactive: false, width: 700, height: 300, mode: 'pct' });
    const h = TS.length === 3 ? 140 : TS.length === 2 ? 170 : 210;
    root.querySelectorAll('[data-line]').forEach((el) => lineChart(el, priceSeries(D.history, main, el.dataset.line, endKey), { interactive: false, width: 700, height: h, label: `${T1[el.dataset.line]} price` }));
    const sEl = root.querySelector('[data-sales]'); if (sEl) { const ss = salesSeries(D.history, main, TS, endKey); barChart(sEl, ss.rows, { interactive: false, width: 700, height: 130, label: 'Homes sold' });
      root.querySelector('[data-sales-sub]').textContent = `${ss.group === 'Grand Totals' ? 'Greater Vancouver' : ss.group}${ss.group !== main && ss.group !== 'Grand Totals' ? ' (whole area)' : ''}`; }
  }
}
</script></body></html>
